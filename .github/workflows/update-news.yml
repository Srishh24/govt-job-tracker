# Optional: if you host this site on GitHub Pages, this refreshes the news every 6 hours
# so you and your friends always see fresh admit card / result updates.
name: Update news

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/feed.js
          git diff --cached --quiet || git commit -m "Update news feed"
          git push
